<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">v1xtron Vulnpire whoami terminal</title>
  <desc id="desc">An animated vampiric terminal-style identity card for v1xtron, focused on security research, AI engineering, and developer tooling.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08070f"/>
      <stop offset="0.58" stop-color="#130a1c"/>
      <stop offset="1" stop-color="#250b18"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3864"/>
      <stop offset="0.52" stop-color="#9b5de5"/>
      <stop offset="1" stop-color="#ff8fab"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8fab"/>
      <stop offset="1" stop-color="#ffe0e8"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#9b5de5" stroke-opacity=".1"/>
      <circle cx="2" cy="2" r="1.2" fill="#ff3864" fill-opacity=".42"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .tiny { font-size: 13px; letter-spacing: 1.4px; }
      .label { font-size: 18px; font-weight: 700; letter-spacing: .8px; }
      .value { font-size: 18px; letter-spacing: .2px; }
      .prompt { font-size: 21px; letter-spacing: .4px; }
      .blink { animation: blink 1.05s steps(2, jump-none) infinite; }
      .scan { animation: scan 5.5s linear infinite; }
      .pulse { animation: pulse 3s ease-in-out infinite; transform-origin: center; }
      .type-1 { animation: type-1 13.5s ease-in-out infinite; }
      .type-2 { animation: type-2 13.5s ease-in-out infinite; }
      .type-3 { animation: type-3 13.5s ease-in-out infinite; }
      .type-4 { animation: type-4 13.5s ease-in-out infinite; }
      @keyframes blink { 50% { opacity: .12; } }
      @keyframes scan { from { transform: translateY(-12px); opacity: 0; } 15% { opacity: .5; } 84% { opacity: .18; } to { transform: translateY(430px); opacity: 0; } }
      @keyframes pulse { 50% { opacity: .48; } }
      @keyframes type-1 { 0%, 8% { opacity: 0; } 14%, 85% { opacity: 1; } 94%, 100% { opacity: 0; } }
      @keyframes type-2 { 0%, 18% { opacity: 0; } 24%, 85% { opacity: 1; } 94%, 100% { opacity: 0; } }
      @keyframes type-3 { 0%, 31% { opacity: 0; } 37%, 85% { opacity: 1; } 94%, 100% { opacity: 0; } }
      @keyframes type-4 { 0%, 44% { opacity: 0; } 50%, 85% { opacity: 1; } 94%, 100% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .blink, .scan, .pulse, .type-1, .type-2, .type-3, .type-4 { animation: none; }
        .type-1, .type-2, .type-3, .type-4 { opacity: 1; }
      }
    </style>
  </defs>

  <rect width="1200" height="430" rx="22" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="1197" height="427" rx="20" fill="none" stroke="url(#edge)" stroke-opacity=".82" stroke-width="3"/>
  <rect x="18" y="18" width="1164" height="394" rx="15" fill="url(#grid)"/>
  <rect x="18" y="18" width="1164" height="394" rx="15" fill="none" stroke="#9b5de5" stroke-opacity=".24"/>

  <circle cx="48" cy="48" r="7" fill="#ff5f57"/>
  <circle cx="72" cy="48" r="7" fill="#febc2e"/>
  <circle cx="96" cy="48" r="7" fill="#28c840"/>
  <text x="126" y="54" class="mono tiny" fill="#c7b8d9">v1xtron@vulnpire:~</text>
  <text x="1152" y="54" class="mono tiny" text-anchor="end" fill="#ff8fab">VULNPIRE // 01</text>
  <line x1="42" y1="76" x2="1158" y2="76" stroke="#9b5de5" stroke-opacity=".28"/>

  <text x="52" y="116" class="mono prompt" fill="#ff8fab">v1xtron@vulnpire:~$</text>
  <text x="370" y="116" class="mono prompt" fill="url(#cyan)">whoami</text>
  <rect x="474" y="96" width="12" height="24" rx="2" class="blink" fill="#ff8fab"/>

  <text x="52" y="158" class="mono tiny" fill="#ff3864">[ VULNPIRE SESSION ESTABLISHED ]</text>
  <text x="52" y="188" class="mono tiny" fill="#8e789f">────────────────────────────────────────────────────────────────────────────────────────────</text>

  <g fill="#251b38" opacity=".7">
    <rect x="44" y="207" width="1060" height="34" rx="8"/>
    <rect x="44" y="249" width="1060" height="34" rx="8"/>
    <rect x="44" y="291" width="1060" height="34" rx="8"/>
    <rect x="44" y="333" width="1060" height="34" rx="8"/>
  </g>

  <g class="mono value" fill="#6d5b7d">
    <text x="64" y="230"><tspan class="label" fill="#6d5b7d">handle</tspan><tspan x="218">:</tspan><tspan x="250">v1xtron</tspan></text>
    <text x="64" y="272"><tspan class="label" fill="#6d5b7d">mode</tspan><tspan x="218">:</tspan><tspan x="250">confident, curious, diligent, always learning</tspan></text>
    <text x="64" y="314"><tspan class="label" fill="#6d5b7d">focus</tspan><tspan x="218">:</tspan><tspan x="250">security research / AI engineering / developer tooling</tspan></text>
    <text x="64" y="356"><tspan class="label" fill="#6d5b7d">sidequests</tspan><tspan x="218">:</tspan><tspan x="250">bug bounty / CTFs / reversing / strange systems</tspan></text>
  </g>

  <g class="mono value" fill="#dce8ff">
    <text class="type-1" x="64" y="230"><tspan class="label" fill="#ff8fab">handle</tspan><tspan x="218">:</tspan><tspan x="250">v1xtron</tspan></text>
    <text class="type-2" x="64" y="272"><tspan class="label" fill="#c58cff">mode</tspan><tspan x="218">:</tspan><tspan x="250">confident, curious, diligent, always learning</tspan></text>
    <text class="type-3" x="64" y="314"><tspan class="label" fill="#c58cff">focus</tspan><tspan x="218">:</tspan><tspan x="250">security research / AI engineering / developer tooling</tspan></text>
    <text class="type-4" x="64" y="356"><tspan class="label" fill="#ff3864">sidequests</tspan><tspan x="218">:</tspan><tspan x="250">bug bounty / CTFs / reversing / strange systems</tspan></text>
  </g>

  <g transform="translate(1120 214)">
    <circle cx="0" cy="0" r="42" fill="#ff3864" fill-opacity=".1" class="pulse" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="27" fill="none" stroke="#9b5de5" stroke-opacity=".78" stroke-width="2"/>
    <circle cx="0" cy="0" r="10" fill="#110b1a" stroke="#ff3864" stroke-width="2"/>
    <path d="M0-27V-39M0 27V39M-27 0H-39M27 0H39" stroke="#ff8fab" stroke-width="2"/>
  </g>
  <text x="1120" y="286" class="mono tiny" text-anchor="middle" fill="#c7b8d9">V1XTRON // BUILD</text>
  <text x="1120" y="305" class="mono tiny" text-anchor="middle" fill="#c7b8d9">LEARN // GROW</text>

  <rect x="18" y="18" width="1164" height="3" rx="1.5" class="scan" fill="url(#edge)" opacity=".35"/>
</svg>
