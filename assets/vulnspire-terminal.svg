<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">v1xtron Vulnpire terminal</title>
  <desc id="desc">A vampiric cyberpunk terminal for v1xtron, combining security research, AI engineering, and proof-first systems.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08070f"/>
      <stop offset="0.55" stop-color="#130a1c"/>
      <stop offset="1" stop-color="#250b18"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3864"/>
      <stop offset="0.5" stop-color="#9b5de5"/>
      <stop offset="1" stop-color="#ff8fab"/>
    </linearGradient>
    <linearGradient id="cyanText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8fab"/>
      <stop offset="1" stop-color="#ffe0e8"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#9b5de5" stroke-opacity=".1"/>
      <circle cx="2" cy="2" r="1.2" fill="#ff3864" fill-opacity=".5"/>
    </pattern>
    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowPink" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .small { font-size: 14px; letter-spacing: 1.3px; }
      .body { font-size: 18px; letter-spacing: .4px; }
      .title { font-size: 31px; font-weight: 700; letter-spacing: 3px; }
      .blink { animation: blink 1.15s steps(2, jump-none) infinite; }
      .scan { animation: scan 5s linear infinite; }
      .pulse { animation: pulse 2.8s ease-in-out infinite; transform-origin: center; }
      @keyframes blink { 50% { opacity: .2; } }
      @keyframes scan { from { transform: translateY(-12px); opacity: 0; } 12% { opacity: .55; } 82% { opacity: .28; } to { transform: translateY(430px); opacity: 0; } }
      @keyframes pulse { 50% { opacity: .45; } }
    </style>
  </defs>

  <rect width="1200" height="420" rx="22" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="1197" height="417" rx="20" fill="none" stroke="url(#edge)" stroke-opacity=".8" stroke-width="3"/>
  <rect x="18" y="18" width="1164" height="384" rx="15" fill="url(#grid)"/>
  <rect x="18" y="18" width="1164" height="384" rx="15" fill="none" stroke="#9b5de5" stroke-opacity=".24"/>

  <circle cx="48" cy="48" r="7" fill="#ff5f57"/>
  <circle cx="72" cy="48" r="7" fill="#febc2e"/>
  <circle cx="96" cy="48" r="7" fill="#28c840"/>
  <text x="125" y="54" class="mono small" fill="#c7b8d9">v@vulnspire:~</text>
  <text x="1135" y="54" class="mono small" text-anchor="end" fill="#ff8fab">VULNPIRE // V</text>

  <line x1="42" y1="76" x2="1158" y2="76" stroke="#9b5de5" stroke-opacity=".28"/>
  <text x="48" y="118" class="mono small"><tspan fill="#ff8fab">v@vulnspire:~$</tspan><tspan fill="#f3dce5"> vulnspire validate --browser-proof</tspan><tspan class="blink" fill="#ff8fab"> ▌</tspan></text>
  <text x="48" y="161" class="mono title" fill="url(#cyanText)" filter="url(#glowCyan)">SHARP EYES. CLEAN PROOF.</text>
  <text x="48" y="194" class="mono body" fill="#f3dce5">security research · AI engineering · strange systems</text>

  <text x="52" y="246" class="mono body" fill="#ff8fab">[ OK ]</text>
  <text x="142" y="246" class="mono body" fill="#d0bed5">security instincts online</text>
  <text x="52" y="279" class="mono body" fill="#ff8fab">[ OK ]</text>
  <text x="142" y="279" class="mono body" fill="#d0bed5">proof before posture</text>
  <text x="52" y="312" class="mono body" fill="#ff8fab">[ OK ]</text>
  <text x="142" y="312" class="mono body" fill="#d0bed5">vulnspire control plane linked</text>
  <text x="52" y="345" class="mono body" fill="#ff3864">[ &gt; ]</text>
  <text x="142" y="345" class="mono body" fill="#f3dce5">learn · hunt · build · repeat</text>
  <rect x="478" y="329" width="12" height="22" rx="2" class="blink" fill="#ff8fab"/>

  <g transform="translate(800 112)">
    <circle cx="118" cy="116" r="98" fill="#ff3864" fill-opacity=".1" class="pulse" filter="url(#glowPink)"/>
    <circle cx="118" cy="116" r="72" fill="none" stroke="#9b5de5" stroke-opacity=".65" stroke-width="2"/>
    <circle cx="118" cy="116" r="48" fill="none" stroke="#ff3864" stroke-opacity=".78" stroke-width="2" stroke-dasharray="4 9"/>
    <path d="M118 25V207M27 116H209M54 52L182 180M182 52L54 180" stroke="#9b5de5" stroke-opacity=".3"/>
    <path d="M118 56L175 89V155L118 188L61 155V89Z" fill="none" stroke="url(#edge)" stroke-width="3" filter="url(#glowCyan)"/>
    <path d="M118 78L156 100V144L118 166L80 144V100Z" fill="#110b1a" stroke="#ff3864" stroke-opacity=".85" stroke-width="2"/>
    <path d="M102 116L113 127L137 103" fill="none" stroke="#ff8fab" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowCyan)"/>
    <text x="118" y="251" class="mono small" text-anchor="middle" fill="#ffe0e8">SIGNAL // PROOF // IMPACT</text>
  </g>

  <rect x="18" y="18" width="1164" height="3" rx="1.5" class="scan" fill="url(#edge)" opacity=".35"/>
</svg>
