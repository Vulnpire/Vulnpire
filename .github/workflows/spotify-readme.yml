name: Refresh Spotify profile card

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

jobs:
  refresh:
    if: vars.SPOTIFY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out profile
        uses: actions/checkout@v4
      - name: Refresh the local card
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: python3 scripts/spotify_recently_played.py
      - name: Publish changed card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/spotify-now-playing.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: refresh Spotify listening card"
          git push
